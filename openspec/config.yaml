# SDD Configuration — AutoGodot
# Generated by sdd-init on 2026-07-24

project: autogodot
version: "0.1.0"
persistence: engram

# Strict TDD — test runner exists (pytest), default true
strict_tdd: true

# Testing capabilities
testing:
  runner: pytest
  runner_command: "pytest"
  version: ">=7.0.0"
  asyncio_mode: auto
  coverage_threshold: 30
  coverage_source: core
  layers:
    - name: unit
      path: tests/
      runner: pytest
      markers: []
    - name: integration
      path: tests/
      runner: pytest
      markers: []
  linter:
    name: ruff
    command: "ruff check"
    rules: ["E", "W", "F", "I", "N", "UP", "B", "SIM"]
  formatter:
    name: black
    command: "black"
    line_length: 88
  type_checker:
    name: mypy
    command: "mypy core/"
    strict: false
    check_untyped_defs: true

# Stack detection
stack:
  language: python
  version: ">=3.10"
  runtime: cpython
  framework: fastmcp
  transport: stdio
  dependencies:
    - mcp>=1.0.0
    - pydantic>=2.0.0
    - godot-parser>=0.1.7
    - mss>=9.0.0
    - Pillow>=10.0.0
    - python-xlib>=0.33
    - aiofiles>=23.0.0

# Architecture
architecture:
  pattern: layered
  modules:
    - name: core/mcp_server.py
      role: Protocol handler + tool definitions
      pattern: FastMCP @mcp.tool() decorators
    - name: core/godot_controller.py
      role: Godot subprocess management
      pattern: Async subprocess with timeout
    - name: core/vision_qa.py
      role: Screen capture + image processing
      pattern: mss + Pillow
    - name: core/scene_builder.py
      role: .tscn structured manipulation
      pattern: godot-parser wrapper

# Conventions
conventions:
  tool_functions: async, return str
  input_validation: Pydantic BaseModel with Field()
  path_security: resolve + prefix check
  responses: structured text for LLM consumption
  singletons: module-level instances
  test_style: class-based, monkeypatch isolation
